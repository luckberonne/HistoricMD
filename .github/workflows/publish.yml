name: Publish to VS Code Marketplace

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Package .vsix
        id: package
        run: |
          npx --yes @vscode/vsce package
          echo "vsix=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish -p "$VSCE_PAT" --packagePath "${{ steps.package.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          files: ${{ steps.package.outputs.vsix }}
          generate_release_notes: true
