name: Validate pixel PR

on:
  pull_request:
    paths:
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Check only README.md changed
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ "$CHANGED" != "README.md" ]; then
            echo "❌ El PR debe modificar únicamente README.md. Archivos cambiados:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Extract base and head README
        run: |
          git show "origin/${{ github.base_ref }}:README.md" > /tmp/base_readme.md
          cp README.md /tmp/head_readme.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate single pixel change
        run: python scripts/validate_pixel.py /tmp/base_readme.md /tmp/head_readme.md
